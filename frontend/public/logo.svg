<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle inner border highlight -->
  <rect x="7" y="7" width="86" height="86" rx="25" stroke="white" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Shopping Bag Outline -->
  <path d="M30 42 C30 38, 33 35, 37 35 L63 35 C67 35, 70 38, 70 42 L74 72 C74 77, 70 81, 65 81 L35 81 C30 81, 26 77, 26 72 Z" fill="white" fill-opacity="0.16" stroke="white" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bag Handle -->
  <path d="M40 36 V28 C40 22.477, 44.477 18, 50 18 C55.523 18, 60 22.477, 60 28 V36" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dynamic Voice Waves inside Bag -->
  <!-- Bar 1 -->
  <rect x="36" y="55" width="4" height="12" rx="2" fill="url(#waveGrad)"/>
  <!-- Bar 2 -->
  <rect x="43" y="48" width="4" height="26" rx="2" fill="url(#waveGrad)"/>
  <!-- Bar 3 (Center peak) -->
  <rect x="50" y="43" width="4" height="36" rx="2" fill="white"/>
  <!-- Bar 4 -->
  <rect x="57" y="48" width="4" height="26" rx="2" fill="url(#waveGrad)"/>
  <!-- Bar 5 -->
  <rect x="64" y="55" width="4" height="12" rx="2" fill="url(#waveGrad)"/>

  <!-- AI Sparkle in top-right -->
  <path d="M78 18 C78 22, 82 22, 82 22 C82 22, 78 22, 78 26 C78 22, 74 22, 74 22 C74 22, 78 22, 78 18 Z" fill="#FDE047"/>
</svg>
